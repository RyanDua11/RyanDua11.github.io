<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando... — ryan.dev</title>
  <script>
    /* Rota antiga (project.html?slug=x) substituída por /projetos/x/.
       Mantido como redirect para não quebrar links já indexados. */
    var slug = new URLSearchParams(window.location.search).get('slug');
    var lang = new URLSearchParams(window.location.search).get('lang');
    var target = slug ? 'projetos/' + slug + '/index.html' : 'index.html#projects';
    if (lang) target += (target.indexOf('?') === -1 ? '?' : '&') + 'lang=' + lang;
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Redirecionando... <a id="fallback" href="index.html#projects">clique aqui se não for redirecionado</a>.</p>
</body>
</html>
